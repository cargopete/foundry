<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Machine room</title>
<style>
@font-face { font-family: 'Space Grotesk'; src: url('../fonts/space-grotesk.woff2') format('woff2'); font-weight: 300 700; }
@font-face { font-family: 'JetBrains Mono'; src: url('../fonts/jetbrains-mono.woff2') format('woff2'); }
html { font-size: 112.5%; } body { margin: 0; background: #171614; color: #ece9e3; font-family: 'Space Grotesk', sans-serif; }
.hero { position: relative; height: 100vh; overflow: hidden; isolation: isolate; display: flex; align-items: center; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -2; }
.hero::after { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, rgba(23,22,20,.94) 0%, rgba(23,22,20,.55) 36%, rgba(23,22,20,0) 62%), linear-gradient(180deg, rgba(23,22,20,.5) 0%, rgba(23,22,20,0) 22%, rgba(23,22,20,0) 75%, #171614 100%); }
.scan { position: absolute; inset: 0; z-index: -1; opacity: .2; background: repeating-linear-gradient(180deg, transparent 0, transparent 2px, rgba(0,0,0,.35) 3px, transparent 4px); }
.copy { margin-left: 8vw; max-width: 34rem; }
.eb { display: inline-flex; gap: .5rem; align-items: center; font-family: 'JetBrains Mono', monospace; font-size: .6875rem; letter-spacing: .14em; text-transform: uppercase; color: #f2cbbb; background: rgba(208,112,79,.12); padding: .35rem .75rem; border-radius: 999px; }
h1 { font-weight: 500; font-size: clamp(2.4rem, 5vw, 4.4rem); line-height: 1.03; letter-spacing: -.04em; margin: 1.2rem 0; }
p { color: #9c978c; font-size: 1rem; max-width: 34ch; }
</style>
</head>
<body>
<section class="hero">
  <canvas id="c"></canvas><div class="scan"></div>
  <div class="copy"><span class="eb">v5.17.2 · MIT or Apache-2.0</span><h1>Be your own indexer.</h1><p>Turn an EVM contract's history into a local SQL database. One Rust binary, no Postgres, no subgraph to write, and an MCP server built in.</p></div>
</section>
<script type="module">
import { createMachineRoom } from './src/machine-room.js';
createMachineRoom(document.getElementById('c'));
</script>
</body>
</html>
